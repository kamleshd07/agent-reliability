[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability"
dynamic = ["version"]
description = "Vendor-neutral reliability engineering for autonomous AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Agent Reliability contributors" }]
keywords = [
    "ai-agents",
    "agent-reliability",
    "llm",
    "reliability",
    "slo",
    "evaluation",
    "observability",
    "opentelemetry",
    "testing",
    "sre",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kamleshd07/agent-reliability"
Documentation = "https://github.com/kamleshd07/agent-reliability/tree/main/docs"
Changelog = "https://github.com/kamleshd07/agent-reliability/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Experimental automatic instrumentation: one exactly tested hook surface.
langchain = ["langchain-core==1.6.13"]
http = ["httpx>=0.28.1,<0.29"]
otel = ["opentelemetry-api>=1.44,<2"]
otel-test = ["opentelemetry-sdk>=1.44,<2"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.108",
    "build>=1.2",
    # Test-only: generates the disposable TLS certificates used by the real-TLS tests.
    "cryptography>=42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability"]

# Internal agent instructions, internal milestone review/execution reports and local-path
# evidence artifacts are not part of the distributed source. Public documentation, the
# licence, source files and everything the test suite reads from a source checkout stay
# (P29_PILOT_RUNBOOK.md is deliberately kept: tests read it). Owner decision F-9
# (2026-10-17) covers CLAUDE.md, AGENTS.md and docs/P28_*; the P29 entries are the same
# rule applied to P29's internal reports.
[tool.hatch.build.targets.sdist]
exclude = [
    "/CLAUDE.md",
    "/AGENTS.md",
    "/docs/P28_*",
    "/docs/GA_READINESS.md",
    "/docs/DX_REVIEW.md",
    "/docs/P29_ACCEPTANCE_MATRIX.md",
    "/docs/P29_IMPLEMENTATION_LOG.md",
    "/docs/P29_INDEPENDENT_REVIEW.md",
    "/docs/P29_P28_RECONCILIATION.md",
    "/docs/P29_REVIEW_REMEDIATION_REPORT.md",
    "/docs/P29_TARGETED_VERIFICATION.md",
    "/docs/P29_TEST_EVIDENCE.md",
    "/docs/P29_WORKSPACE_BASELINE*",
    "/docs/evidence",
    "/docs/p30",
    "/docs/p29-calibration/GAP_ASSESSMENT.md",
    "/docs/p29-calibration/PLATFORM_PROPOSAL.md",
    "/docs/p29-calibration/TRACEABILITY_MATRIX.md",
    "/docs/p29-calibration/COMPATIBILITY_REPORT.md",
    "/docs/p29-calibration/GO_NO_GO.md",
    "/docs/p29-calibration/OWNER_DECISIONS_S4.md",
    "/docs/p29-calibration/FUTURE_CALIBRATION_PLAN.md",
    "/docs/p29-calibration/reviews",
]

[tool.hatch.version]
path = "src/agent_reliability/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["agent_reliability", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_reliability"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure, fast, no I/O",
    "integration: exercises a real external boundary",
    "contract: verifies an implementation against a port's contract",
    "property: hypothesis-based property tests",
]

[tool.coverage.run]
source = ["src/agent_reliability"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
